server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # Hide the nginx version
    client_max_body_size 16k;     # Reject oversized request bodies early

    # Container health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Forward API calls to the backend container over HTTPS (self-signed certificate inside the Docker network)
    location /api/ {
        proxy_pass https://api:5001;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html so React Router can handle them
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
