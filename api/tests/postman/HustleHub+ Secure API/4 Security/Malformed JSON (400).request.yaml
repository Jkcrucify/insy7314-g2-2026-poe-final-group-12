$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "email": "broken'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('No stack trace leaked', () => pm.expect(pm.response.text()).to.not.match(/at .*\.js/));
    language: text/javascript
order: 3000
