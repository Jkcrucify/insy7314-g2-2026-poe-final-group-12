$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "client{{runId}}@test.com",
      "password": "WrongPass1!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Generic error message (no user enumeration)', () => pm.expect(pm.response.json().message).to.eql('Invalid credentials.'));
      pm.test('No token issued', () => pm.expect(pm.response.json().token).to.be.undefined);
    language: text/javascript
order: 10000
