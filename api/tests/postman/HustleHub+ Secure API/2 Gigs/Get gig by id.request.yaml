$kind: http-request
url: "{{baseUrl}}/api/gigs/{{gigId}}"
method: GET
headers:
  Authorization: Bearer {{clientToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Correct gig returned', () => pm.expect(pm.response.json().gig._id).to.eql(pm.collectionVariables.get('gigId')));
    language: text/javascript
order: 9000
