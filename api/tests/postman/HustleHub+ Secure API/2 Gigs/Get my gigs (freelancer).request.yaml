$kind: http-request
url: "{{baseUrl}}/api/gigs/mine"
method: GET
headers:
  Authorization: Bearer {{freelancerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Only own gigs returned (2)', () => pm.expect(pm.response.json().count).to.eql(2));
    language: text/javascript
order: 14000
