$kind: http-request
url: "{{baseUrl}}/api/gigs"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{freelancerToken}}
body:
  type: text
  content: |-
    {
      "title": "Professional Logo Design",
      "description": "I will design a modern, unique logo for your brand with unlimited revisions.",
      "category": "Design",
      "price": 1500,
      "deliveryDays": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const gig = pm.response.json().gig;
      pm.test('Gig has an id', () => pm.expect(gig._id).to.be.a('string'));
      pm.collectionVariables.set('gigId', gig._id);
    language: text/javascript
order: 1000
