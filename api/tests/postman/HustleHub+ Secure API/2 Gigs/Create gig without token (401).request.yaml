$kind: http-request
url: "{{baseUrl}}/api/gigs"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Anonymous gig",
      "description": "This request must be blocked because there is no JWT.",
      "category": "Other",
      "price": 100,
      "deliveryDays": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
