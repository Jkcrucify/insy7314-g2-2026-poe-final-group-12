$kind: http-request
url: "{{baseUrl}}/api/gigs/{{gigId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{freelancerToken}}
body:
  type: text
  content: |-
    {
      "title": "Premium Logo Design",
      "price": 1800
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Price updated', () => pm.expect(pm.response.json().gig.price).to.eql(1800));
    language: text/javascript
order: 11000
