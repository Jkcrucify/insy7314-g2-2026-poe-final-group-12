$kind: http-request
url: "{{baseUrl}}/api/bookings/mine"
method: GET
headers:
  Authorization: Bearer {{freelancer2Token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('No access to other users bookings', () => pm.expect(pm.response.json().count).to.eql(0));
    language: text/javascript
order: 6000
