$kind: http-request
url: "{{baseUrl}}/api/bookings/mine"
method: GET
headers:
  Authorization: Bearer {{freelancerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Booking is listed', () => pm.expect(pm.response.json().bookings.map(b => b._id)).to.include(pm.collectionVariables.get('bookingId')));
    language: text/javascript
order: 5000
