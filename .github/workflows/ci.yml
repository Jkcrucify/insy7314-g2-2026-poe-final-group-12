name: CI/CD Pipeline

# Runs automatically on every push and pull request to main. Each job fails the
# build when a check does not pass, so broken or insecure code cannot be merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels the run still in progress for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend: static analysis, dependency audit and the automated test suite
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, audit, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Static application security testing. --max-warnings=0 means a single
      # unresolved finding fails the pipeline.
      - name: Static code analysis (ESLint + eslint-plugin-security)
        run: npm run lint -- --max-warnings=0

      - name: Static analysis report
        if: always()
        run: npm run lint:report || true

      # Gate: anything that ships inside the container. A high or critical
      # advisory in a production dependency fails the build.
      - name: Dependency vulnerability audit (production)
        run: npm audit --omit=dev --audit-level=high

      # Reported but not blocking: build-time tooling (Newman, Jest) never runs
      # in the deployed image, so an advisory there is not an exposure.
      - name: Dependency vulnerability audit (including dev tooling)
        continue-on-error: true
        run: npm audit --audit-level=high

      # The suite starts an in-memory MongoDB replica set; cache the binary so
      # it is downloaded once rather than on every run.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run backend tests
        run: npm run test:coverage
        env:
          JWT_SECRET: ci-test-secret-not-used-anywhere-else
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            api/tests/reports/eslint-report.json
            api/tests/reports/coverage/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Frontend: static analysis, unit tests and a production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static code analysis (ESLint + React, hooks, accessibility)
        run: npm run lint -- --max-warnings=0

      - name: Static analysis report
        if: always()
        run: mkdir -p test-report && npm run lint:report || true

      - name: Dependency vulnerability audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency vulnerability audit (including dev tooling)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build the production bundle
        run: npm run build

      - name: Upload frontend reports and build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            client/test-report/
            client/dist/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Docker: build both images and run the whole stack, then test against it
  # ---------------------------------------------------------------------------
  docker:
    name: Docker stack (build, run, API tests)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A throwaway secret: this stack is destroyed at the end of the job
      - name: Create the environment file
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      # Builds both images: the API (Node) and the client (Vite build, then nginx)
      - name: Build the API and client images
        run: docker compose build

      # --wait blocks until MongoDB, the API and nginx all report healthy.
      # A container that fails its health check fails this step.
      - name: Start the whole stack
        run: docker compose up --detach --wait --wait-timeout 300

      - name: Show the running containers
        run: docker compose ps

      - name: Check the API is healthy over HTTPS
        run: curl --fail --insecure --show-error --silent https://localhost:5001/api/status

      - name: Check the client is served by nginx
        run: |
          curl --fail --show-error --silent http://localhost:8080/healthz
          curl --fail --show-error --silent http://localhost:8080/ | grep -q "<div id=\"root\">"

      - name: Check the client sends its security headers
        run: |
          headers=$(curl --silent --head http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          echo "$headers" | grep -qi "x-frame-options"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install the API test tooling
        working-directory: api
        run: npm ci

      # End-to-end security and functional tests against the real containers:
      # authentication, RBAC, ownership, XSS, NoSQL injection and security headers
      - name: Run the Postman/Newman API suite
        working-directory: api
        run: npm run test:api

      # Run last: it deliberately trips the brute-force limiter
      - name: Run the rate limiting suite
        working-directory: api
        run: npm run test:ratelimit

      - name: Upload the Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: api/tests/reports/*.html
          if-no-files-found: ignore

      - name: Collect the container logs as evidence
        if: always()
        run: |
          mkdir -p logs
          docker compose logs --no-color api > logs/api-container.log
          docker compose logs --no-color client > logs/client-container.log
          docker compose exec -T api sh -c 'cat /app/logs/security.log' > logs/security.log || true
          docker compose exec -T api sh -c 'cat /app/logs/app.log' > logs/app.log || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: logs/
          if-no-files-found: ignore

      - name: Tear the stack down
        if: always()
        run: docker compose down --volumes
